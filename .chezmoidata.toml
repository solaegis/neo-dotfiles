# Source of truth for Homebrew and Mac App Store.
# Brewfile and mas-ids.txt are generated at apply time.
#
# Layer precedence (templates compose in order):
#   shared → OS (linux) → context (personal/work) → work profile → enabledWorkProfiles → hostname

# ----------------------------------------------------------------------------- 
# Layer 0: shared baseline (all contexts, all macOS hosts)
# -----------------------------------------------------------------------------

[brew.shared]
formulae = [
  "chezmoi",
  "zsh",
  "git",
  "fzf",
  "age",
  "mas",
  "openssh",
  "cmake",
  "rust",
  "tree",
  "go-task",
]
casks = [
  "font-meslo-lg-nerd-font",
  "iterm2",
]
taps = []
vscode = [
  "anysphere.remote-ssh",
]
cargo = [
  "cargo-outdated",
  "dotward",
]
services = []

[brew.linux]
formulae = [
  "chezmoi",
  "zsh",
  "git",
  "fzf",
  "age",
]
casks = []
taps = []
vscode = []
cargo = []
services = []

