# Source of truth for Homebrew and Mac App Store. Brewfile and mas-ids.txt are
# generated at apply time. Sections: mac (all macOS), linux (all Linux), and
# hosts.<hostname> (this machine only; hostname from `hostname` e.g. neo).

[brew.mac]
formulae = [
  "chezmoi",
  "zsh",
  "git",
  "fzf",
  "age",
  "mas",
]
casks = [
  "font-meslo-lg-nerd-font",
]

[brew.linux]
formulae = [
  "chezmoi",
  "zsh",
  "git",
  "fzf",
  "age",
]
casks = []

# Host-specific: only applied when hostname matches (e.g. neo).
# Add other hosts as [brew.hosts.OTHERHOST] with formulae = [...] and/or casks = [...]
[brew.hosts.neo]
formulae = []
casks = []

